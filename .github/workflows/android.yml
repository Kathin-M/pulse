name: Android APK

# Builds a signed APK: a full-screen WebView on the deployed site. It loads the live
# app, so web deploys update it; rebuild only when files under android/ change.
# Output: the "android" GitHub release (Pulse.apk).
# Needs: vars PULSE_HOST, ANDROID_PACKAGE; secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    if: vars.PULSE_HOST != '' && vars.ANDROID_PACKAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build signed APK
        working-directory: android
        env:
          PULSE_HOST: ${{ vars.PULSE_HOST }}
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Pulse.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Pulse for Android" --notes "Install Pulse.apk on your phone."
          gh release edit android --notes "Install Pulse.apk on your phone. It opens the live app, so it updates itself with every deploy. Build ${{ github.run_number }}."
          gh release upload android Pulse.apk --clobber
