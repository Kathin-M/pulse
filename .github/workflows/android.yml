name: Android APK

# Builds a signed APK (a Trusted Web Activity) that opens the deployed site full screen.
# The APK loads the live site, so app updates arrive with every web deploy; rebuild
# only when the icon, name or this config changes. Output: the "android" GitHub release.
# Needs: vars PULSE_HOST, ANDROID_PACKAGE; secrets ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml", "web/public/icon-*.png"]

permissions:
  contents: write

jobs:
  apk:
    if: vars.PULSE_HOST != '' && vars.ANDROID_PACKAGE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare TWA project
        env:
          PULSE_HOST: ${{ vars.PULSE_HOST }}
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p build-android ~/.bubblewrap
          envsubst < android/twa-manifest.template.json > build-android/twa-manifest.json
          printf '%s' "$KEYSTORE_B64" | base64 -d > build-android/android.keystore
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          npm install -g @bubblewrap/cli@1
      - name: Build APK
        working-directory: build-android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
          cp app-release-signed.apk ../Pulse.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Pulse for Android" --notes "Install Pulse.apk on your phone. It opens the live app, so it updates itself with every deploy."
          gh release upload android Pulse.apk --clobber
