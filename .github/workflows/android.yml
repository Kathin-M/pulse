name: Android app

# Builds the native Android app (Kotlin + Jetpack Compose) and publishes it as a GitHub
# release tagged android-<versionCode> with Pulse.apk attached. Installed apps check the
# latest release and offer the update in-app.
# Runs only where repo variable ANDROID_RELEASE is "true" (the public repo), with secrets
# ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD and variable ANDROID_PACKAGE.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write

jobs:
  apk:
    if: vars.ANDROID_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.8"
      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PULSE_DEFAULT_SERVER: ${{ vars.PULSE_DEFAULT_SERVER }}
        run: |
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Pulse.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-$VERSION_CODE" Pulse.apk --latest \
            --title "Pulse for Android 2.$VERSION_CODE" \
            --notes "Native Android app. Install Pulse.apk, log in with your server address and password. Installed apps offer this update automatically."
