plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

// Deployment-specific values come from the environment (set by CI), so the
// open-source code carries no personal URLs.
def env = { String k, String d -> System.getenv(k) ?: d }
def keystorePath = System.getenv("KEYSTORE_PATH")

android {
    namespace "app.pulse.news"
    compileSdk 36

    defaultConfig {
        applicationId env("ANDROID_PACKAGE", "io.github.kathinm.pulse")
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(env("VERSION_CODE", "100"))
        versionName "2." + env("VERSION_CODE", "100")
        // Server the login screen suggests (optional), and the GitHub repo whose releases carry updates.
        buildConfigField "String", "DEFAULT_SERVER", "\"${env("PULSE_DEFAULT_SERVER", "")}\""
        buildConfigField "String", "UPDATE_REPO", "\"${env("GITHUB_REPOSITORY", "")}\""
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    if (keystorePath) {
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias env("KEY_ALIAS", "pulse")
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.02.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.activity:activity-compose:1.9.3"
    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0"
    // Liquid glass (refraction, blur, highlights): https://github.com/Kyant0/AndroidLiquidGlass (Apache-2.0)
    implementation "io.github.kyant0:backdrop:1.0.6"
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
}
